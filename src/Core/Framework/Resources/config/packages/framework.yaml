parameters:
    messenger.default_transport_name: 'v67'
    env(MESSENGER_TRANSPORT_DSN): 'doctrine://default?auto_setup=false'
    env(MESSENGER_TRANSPORT_LOW_PRIORITY_DSN): 'doctrine://default?auto_setup=false&queue_name=low_priority'
    env(MESSENGER_TRANSPORT_FAILURE_DSN): 'doctrine://default?queue_name=failed&auto_setup=false'
    env(MAILER_DSN): 'null://null'
    env(LOCK_DSN): 'flock'
    '.container.dumper.inline_class_loader': false
    '.container.dumper.inline_factories': true
framework:
  trusted_hosts: ~
  fragments: ~
  assets: ~
  serializer: { enabled: true }
  secret: "%env(APP_SECRET)%"
  validation:
    enable_attributes: true
    email_validation_mode: html5
  default_locale:  zh_CN
  http_method_override: true
  mailer:
    message_bus: false
    dsn: '%env(MAILER_DSN)%'
  php_errors:
    log: true
  cache:
    prefix_seed: "%kernel.cache.hash%"
    app: cache.adapter.filesystem
    pools:
      cache.object:
        default_lifetime: 172800
        adapter: cache.app
        tags: cache.tags
      cache.http:
        default_lifetime: 172800
        adapter: cache.app
        tags: cache.tags
      cache.tags:
        adapter: cache.app
      cache.rate_limiter:
        adapter: cache.app
  messenger:
    failure_transport: failed
    serializer:
      default_serializer: messenger.transport.symfony_serializer
      symfony_serializer:
        format: json
        context: { }
    transports:
      failed: "%env(MESSENGER_TRANSPORT_FAILURE_DSN)%"
      async:
        dsn: "%env(MESSENGER_TRANSPORT_DSN)%"
        serializer: messenger.transport.symfony_serializer
        retry_strategy:
          max_retries: 3
          delay: 1000
          multiplier: 2
          max_delay: 0
      low_priority:
        dsn: "%env(MESSENGER_TRANSPORT_LOW_PRIORITY_DSN)%"
        serializer: messenger.transport.symfony_serializer
        retry_strategy:
          max_retries: 3
          delay: 1000
          multiplier: 2
          max_delay: 0
    buses:
      messenger.bus.default:
        middleware:
          - HeyPanel\Core\Framework\Adapter\Messenger\Middleware\QueuedTimeMiddleware
    routing:
      'HeyPanel\Core\Framework\MessageQueue\AsyncMessageInterface': async
      'HeyPanel\Core\Framework\MessageQueue\LowPriorityMessageInterface': low_priority
      'Symfony\Component\Mailer\Messenger\SendEmailMessage': async
      
  exceptions:
    # Symfony exceptions
    Symfony\Component\HttpKernel\Exception\NotFoundHttpException:
      log_level: notice
    Symfony\Component\Routing\Exception\MissingMandatoryParametersException:
      log_level: notice
    Symfony\Component\HttpKernel\Exception\MethodNotAllowedHttpException:
      log_level: notice
    Symfony\Component\HttpKernel\Exception\AccessDeniedHttpException:
      log_level: notice
    Symfony\Component\HttpKernel\Exception\UnauthorizedHttpException:
      log_level: notice
    Symfony\Component\HttpKernel\Exception\UnsupportedMediaTypeHttpException:
      log_level: notice
    Symfony\Component\HttpFoundation\Exception\SuspiciousOperationException:
      log_level: notice
    # HeyPanel exceptions
    HeyPanel\Core\Content\Product\Exception\ProductNotFoundException:
      log_level: notice
    HeyPanel\Core\Content\Category\Exception\CategoryNotFoundException:
      log_level: notice
    HeyPanel\Core\Content\Cms\Exception\PageNotFoundException:
      log_level: notice
    HeyPanel\Core\Framework\DataAbstractionLayer\Dbal\Exception\FieldAccessorBuilderNotFoundException:
      log_level: notice
    HeyPanel\Core\Framework\DataAbstractionLayer\Exception\QueryLimitExceededException:
      log_level: notice
    HeyPanel\Core\Framework\DataAbstractionLayer\Exception\InvalidLimitQueryException:
      log_level: notice
    HeyPanel\Core\Framework\Api\Exception\MissingPrivilegeException:
      log_level: notice
    HeyPanel\Core\Framework\Validation\Exception\ConstraintViolationException:
      log_level: notice
    HeyPanel\Core\Framework\Validation\WriteConstraintViolationException:
      log_level: notice
    HeyPanel\Core\Framework\Uuid\Exception\InvalidUuidException:
      log_level: notice
    HeyPanel\Core\Framework\Routing\Exception\MissingRequestParameterException:
      log_level: notice
    HeyPanel\Core\Framework\DataAbstractionLayer\Write\WriteException:
      log_level: notice
    HeyPanel\Core\Framework\Store\Exception\ExtensionUpdateRequiresConsentAffirmationException:
      log_level: notice
    HeyPanel\Core\Framework\Script\Exception\ScriptExecutionFailedException:
      log_level: notice
    HeyPanel\Core\Framework\DataAbstractionLayer\Exception\InvalidPriceFieldTypeException:
      log_level: notice
    HeyPanel\Core\Content\Product\Exception\ReviewNotActiveExeption:
      log_level: notice
    HeyPanel\Core\Framework\App\Exception\ActionProcessException: #App provides wrong return or does not answer at all
      log_level: notice
    HeyPanel\Core\Content\Product\Exception\DuplicateProductNumberException:
      log_level: notice
    HeyPanel\Core\Framework\DataAbstractionLayer\Exception\SearchRequestException:
      log_level: notice
    HeyPanel\Core\Framework\Api\Exception\ResourceNotFoundException:
      log_level: notice
    HeyPanel\Core\Framework\DataAbstractionLayer\Dbal\Exception\UnmappedFieldException:
      log_level: notice
    HeyPanel\Core\Framework\DataAbstractionLayer\Exception\InvalidFilterQueryException:
      log_level: notice
    HeyPanel\Core\Framework\DataAbstractionLayer\Write\Validation\RestrictDeleteViolationException:
      log_level: notice
    HeyPanel\Core\Content\LandingPage\Exception\LandingPageNotFoundException:
      log_level: notice
    HeyPanel\Core\Framework\Routing\Exception\ChannelNotFoundException:
      log_level: notice
    HeyPanel\Core\Content\ImportExport\Exception\UnexpectedFileTypeException:
      log_level: notice
    HeyPanel\Core\Content\ImportExport\Exception\InvalidFileAccessTokenException:
      log_level: notice
    HeyPanel\Core\System\SystemConfig\Exception\ConfigurationNotFoundException:
      log_level: notice
    HeyPanel\Core\Content\Seo\Exception\InvalidTemplateException:
